# 이 파일은 저장소(repo)의 .github/workflows/monitor.yml 경로에 넣어야 합니다.
# (README.md의 설치 방법 참고)

name: CGV 용아맥 오디세이 예매 모니터

on:
  schedule:
    # 5분마다 실행. GitHub 사정으로 몇 분 정도씩 밀릴 수 있음.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동으로 "Run workflow" 눌러서 테스트 가능

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install requests

      - name: 모니터링 스크립트 실행
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python cgv_monitor.py

      - name: 상태 변경 시 커밋
        run: |
          git config user.name "cgv-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
